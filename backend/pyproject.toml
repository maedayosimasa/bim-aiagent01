[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maedayosimasa", email = "gdre131@yahoo.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "networkx>=3.6.1",
    "shapely>=2.1.2",
    "uvicorn>=0.52.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
