name: Deploy to EC2

# master への push を契機に、AWS Systems Manager (SSM) 経由でEC2上の
# デプロイスクリプトを実行する。EC2側でインバウンドポートを一切開けずに
# 済む(SSM AgentがEC2から能動的にAWSへ接続する方式のため)。このリポジトリ
# は公開(public)だが、push トリガーは fork からの pull_request では
# 発火せず、書き込み権限を持つ者のみが push できるため、Secrets(AWS
# 認証情報)はこの経路では外部に漏れない。
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: i-0a2270fb64b02eecd
        run: |
          set -e

          cat > /tmp/ssm-params.json <<'EOF'
          {
            "commands": [
              "sudo -u ubuntu -H bash -lc 'set -e; cd /home/ubuntu/bim_ai_agent/bim-aiagent01; git fetch origin; git reset --hard origin/master; cd /home/ubuntu/bim_ai_agent/deployment; docker compose up -d --build frontend backend'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy bim-aiagent01@${GITHUB_SHA:0:7} via GitHub Actions" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # `aws ssm wait command-executed` は5秒間隔で最大20回(100秒)しか
          # 待たず、frontend/backendのDockerビルド(キャッシュが効かない
          # 初回等)がそれより長くかかる場合に取りこぼす恐れがあるため、
          # 自前で最大10分ポーリングする。
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
