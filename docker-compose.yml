services:

  frontend:
    build:
      context: ./frontend
    container_name: bim_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # ブラウザから見たbackendの公開URL(frontend/src/api/client.ts参照)。
      # 未設定時はローカル開発既定値(http://localhost:8000)にフォールバックする。
      # EC2等、localhost以外のホストからフロントエンドを配信する場合は必須。
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      # Viteのdevサーバーが受け付けるHostヘッダのホワイトリスト(カンマ区切り、
      # vite.config.ts参照)。未設定ならlocalhost系のみ許可(既定挙動のまま)。
      # EC2をリバースプロキシ経由で実ドメインで公開する場合は必須
      # (例: bim-aiagent.com,www.bim-aiagent.com)。
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - backend


  # PC側(Archicad実行マシン)で稼働しているArchicad MCPサーバーへの
  # ブリッジ。tailnet上のPCとWireGuardトンネルで直結し、backendコンテナは
  # このコンテナのネットワーク名前空間を共有する(下のnetwork_mode参照)。
  # ポート開放・固定IP・VPN機器は一切不要。
  tailscale:
    image: tailscale/tailscale:latest
    container_name: bim_tailscale
    hostname: bim-backend
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # backendがnetwork_mode: service:tailscale で名前空間を共有するため、
    # ホスト向けのポート公開はbackendではなくここで行う。
    ports:
      - "8000:8000"
    restart: unless-stopped


  backend:
    build:
      context: ./backend
    container_name: bim_backend
    network_mode: service:tailscale
    volumes:
      - ./backend:/app
      # ChromaDBのデフォルト埋め込み(ONNX all-MiniLM-L6-v2, 約80MB)は
      # backendコンテナ自身が初回インデックス時にダウンロードする
      # (embedding計算は常にクライアント側=backendで行われ、chromadb
      # サーバーはベクトルの保存/検索のみを担う)。このボリュームが無いと
      # コンテナを作り直すたびに毎回再ダウンロードすることになる。
      - onnx_model_cache:/root/.cache/chroma
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # "onnx"(既定): 意味検索。初回のみモデルDLが必要。
      # "keyword": 依存ゼロのキーワード一致フォールバック(オフライン時用)。
      - CHROMA_EMBEDDING_BACKEND=onnx
      # PC側ブリッジ(stdio->HTTPプロキシ)をTailscale越しに指すURL。
      # 例: https://pc-archicad.tailnet-xxxx.ts.net/mcp
      # 未設定の場合、Archicad連携ツール(list_archicad_tools等)は
      # クラッシュせずエラーを返すだけになる。
      - ARCHICAD_MCP_URL=${ARCHICAD_MCP_URL:-}
      # Legal Knowledge Builder(別リポジトリ)の法令検索APIのURL。
      # 注意: backendはnetwork_mode: service:tailscaleでtailscaleコンテナと
      # ネットワーク名前空間を共有しているため、http://127.0.0.1:8100は
      # ホスト機械上で直接`uv run legal-knowledge-builder serve`している
      # プロセスには届かない(ARCHICAD_MCP_URLのWSLゲートウェイ問題と同種)。
      # docker-compose経由で動かす場合は、ホストのゲートウェイIPやTailscale
      # URL等、実際に到達可能なアドレスを指定すること。
      - LEGAL_API_URL=${LEGAL_API_URL:-}
      # AIエージェント(LangGraph、/agent/*)がClaudeを呼び出すためのAPIキー。
      # 未設定でもbackendは起動するが、/agent/chat等はエラーを返す。
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_AGENT_MODEL=${ANTHROPIC_AGENT_MODEL:-claude-opus-5}
      # 有効採光面積比の法定計算(engine/effective_daylighting.py)で使う
      # 用途地域カテゴリ。BIMデータからは判定できないため手動指定。
      - LAND_USE_CATEGORY=${LAND_USE_CATEGORY:-residential}
      # フロントエンドを配信するオリジン(カンマ区切りで複数可)。CORS許可リスト。
      # 未設定時はローカル開発既定値(http://localhost:5173)のみ許可される。
      # 本番(EC2等)ではフロントエンドの実際のURLを明示的に指定すること。
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      - chromadb
      - tailscale


  chromadb:
    image: chromadb/chroma:latest
    container_name: bim_chroma
    ports:
      - "8001:8000"
    volumes:
      - ./chroma/data:/chroma/chroma


volumes:
  onnx_model_cache:
  tailscale_state:
